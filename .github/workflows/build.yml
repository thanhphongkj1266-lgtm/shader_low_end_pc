name: Build Mod

on:
  push:
    branches: [ "26.3", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cấp quyền thực thi Gradle
        run: chmod +x ./gradlew

      - name: Biên dịch file JAR
        run: ./gradlew build

      - name: Xuất file Mod tải về
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: build/libs/*.jar
